<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Korean Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--paper:#fff;--ink:#16202e;--mute:#5d6b7e;--line:#d3dae4;--blue:#24508f;--red:#c8453b;--green:#2e7d5b;--on:#fff;
--kr:"Noto Serif KR","Batang",serif;--ui:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#121820;--paper:#1b2430;--ink:#e8edf3;--mute:#9aa8ba;--line:#2e3b4c;--blue:#7fa6e0;--red:#e8776d;--green:#5fbf92;--on:#10161d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--ui)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:900 1.6rem var(--kr);margin:8px 0 2px}
#prog{color:var(--mute);margin:0 0 16px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:6px}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.on{background:var(--blue);color:var(--on);border-color:var(--blue)}
#lv button{font:900 1rem var(--kr);min-width:56px}
.card{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--blue);border-radius:6px;padding:28px 20px;text-align:center;min-height:230px;width:100%;display:block;cursor:pointer}
.kr{font:900 3.2rem/1.2 var(--kr)}
.en{font:600 2rem/1.3 var(--ui)}
.card p{color:var(--mute);margin:6px 0 0}
.hint{color:var(--mute);font-size:.9rem;margin:8px 0}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px}
.good{border-color:var(--green);color:var(--green)}
.again{border-color:var(--red);color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts button{padding:14px}
button.ok{background:var(--green);border-color:var(--green);color:var(--on)}
button.no{background:var(--red);border-color:var(--red);color:var(--on)}
.g{background:var(--paper);border:1px solid var(--line);border-left:8px solid var(--red);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.g h3{font:900 1.5rem var(--kr);margin:0}
.g .m{color:var(--blue);font-weight:600;margin:0 0 6px}
.x{font:600 1.1rem var(--kr);background:var(--bg);padding:10px 12px;border-radius:6px}
.x span{font:400 .9rem var(--ui);color:var(--mute)}
.pr b{font:600 1.2rem var(--kr);display:block;margin:12px 0 8px}
.pr u{display:inline-block;min-width:3em;text-decoration:none;border-bottom:2px solid var(--ink)}
.pr div{display:flex;gap:8px;flex-wrap:wrap}
.pr em{display:block;min-height:1.6em;margin-top:8px;font-style:normal;color:var(--green);font-weight:600}
/* category tabs */
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sub button.on{background:var(--red);border-color:var(--red)}
.sub .add{border-style:dashed;color:var(--blue)}
.wl{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.wl li{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.wl li:last-child{border:0}
.wl .k{font:600 1.25rem var(--kr)}
.wl small{color:var(--mute)}
.wl .del{padding:2px 9px;color:var(--mute)}
.af{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.af input{font:inherit;flex:1 1 120px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
textarea.bulk{width:100%;min-height:130px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);resize:vertical}
.bk{margin-top:18px}
.bk h4{margin:0 0 4px}
@media(max-width:480px){.kr{font-size:2.6rem}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>한국어 연습</h1>
<p id="prog"></p>
<div class="row" id="lv" aria-label="Level"></div>
<div class="row" id="md" aria-label="Mode"></div>
<div id="main"></div>
</div>
<script>
/* ============ DATA — edit/add here ============
 Each level: id, t (title), v (words "한글|romanization|meaning"),
 g (grammar: p pattern, m meaning, n note, x [example, translation],
    q [sentence with ___, correct answer, ...wrong answers])
 To add a level, copy one block and change it. */
const DATA=[
{id:'1A',t:'Level 1A',v:['안녕하세요|annyeonghaseyo|hello','감사합니다|gamsahamnida|thank you','학생|haksaeng|student','선생님|seonsaengnim|teacher','물|mul|water','밥|bap|rice, meal','사람|saram|person','한국|hanguk|Korea','이름|ireum|name','네|ne|yes','아니요|aniyo|no','커피|keopi|coffee'],
 g:[{p:'이에요 / 예요',m:'to be (A is B)',n:'Use 이에요 after a final consonant and 예요 after a vowel.',x:['저는 학생이에요.','I am a student.'],q:['저는 학생___.','이에요','예요']},
    {p:'은 / 는',m:'topic marker',n:'은 after a consonant, 는 after a vowel. Marks what the sentence is about.',x:['저는 한국 사람이에요.','I am Korean.'],q:['저___ 선생님이에요.','는','은']},
    {p:'을 / 를',m:'object marker',n:'을 after a consonant, 를 after a vowel. Marks what receives the action.',x:['물을 마셔요.','I drink water.'],q:['커피___ 마셔요.','를','을']}]},
{id:'1B',t:'Level 1B',v:['먹다|meokda|to eat','마시다|masida|to drink','가다|gada|to go','오다|oda|to come','보다|boda|to see, watch','학교|hakgyo|school','집|jip|home','오늘|oneul|today','내일|naeil|tomorrow','친구|chingu|friend','좋아요|joayo|good, I like it'],
 g:[{p:'-아요 / -어요',m:'polite present tense',n:'Remove 다. If the last vowel is ㅏ or ㅗ add 아요, otherwise 어요. 가다 → 가요.',x:['밥을 먹어요.','I eat a meal.'],q:['밥을 (먹다) → ___','먹어요','먹아요']},
    {p:'에',m:'to a place, at a time',n:'Use 에 with 가다, 오다 and times.',x:['학교에 가요.','I go to school.'],q:['집___ 가요.','에','에서']},
    {p:'에서',m:'at a place (action happens there)',n:'Use 에서 when an action takes place at a location.',x:['도서관에서 공부해요.','I study at the library.'],q:['학교___ 공부해요.','에서','에']}]},
{id:'2A',t:'Level 2A',v:['주말|jumal|weekend','시간|sigan|time','같이|gachi|together','어제|eoje|yesterday','여행|yeohaeng|trip, travel','음식|eumsik|food','일|il|work, task','비싸다|bissada|to be expensive','맛있다|masitda|to be delicious','만나다|mannada|to meet'],
 g:[{p:'-았/었어요',m:'past tense',n:'Take the polite present stem and change 어요 to 었어요 (or 아요 to 았어요).',x:['어제 영화를 봤어요.','I watched a movie yesterday.'],q:['어제 친구를 (만나다) → ___','만났어요','만나요','만날 거예요']},
    {p:'-(으)ㄹ 거예요',m:'future, plan',n:'After a vowel add ㄹ 거예요, after a consonant add 을 거예요.',x:['내일 갈 거예요.','I will go tomorrow.'],q:['내일 여행을 ___','갈 거예요','갔어요','가요']},
    {p:'-고 싶다',m:'want to (do)',n:'Attach to the verb stem. Only for your own wishes.',x:['커피를 마시고 싶어요.','I want to drink coffee.'],q:['한국에 가___ 싶어요.','고','서','지만']}]},
{id:'2B',t:'Level 2B',v:['약속|yaksok|appointment, promise','준비|junbi|preparation','이유|iyu|reason','경험|gyeongheom|experience','걱정|geokjeong|worry','바쁘다|bappeuda|to be busy','필요하다|piryohada|to need','어렵다|eoryeopda|to be difficult','쉽다|swipda|to be easy','기다리다|gidarida|to wait'],
 g:[{p:'-아/어서',m:'because, so',n:'Gives a reason. Cannot be used with commands or suggestions.',x:['바빠서 못 가요.','I am busy so I cannot go.'],q:['비가 와___ 안 가요.','서','지만','니까']},
    {p:'-(으)니까',m:'because (reason for a command)',n:'Works with commands and suggestions, unlike -아/어서.',x:['비가 오니까 우산을 가져가세요.','It is raining, so take an umbrella.'],q:['시간이 없___ 빨리 가요.','으니까','지만','고']},
    {p:'-지만',m:'but, although',n:'Attach to the stem to contrast two ideas.',x:['어렵지만 재미있어요.','It is hard but fun.'],q:['맛있___ 비싸요.','지만','서','으니까']}]},
{id:'3A',t:'Level 3A',v:['경제|gyeongje|economy','문화|munhwa|culture','환경|hwangyeong|environment','관계|gwangye|relationship','결정|gyeoljeong|decision','의견|uigyeon|opinion','변화|byeonhwa|change','영향|yeonghyang|influence, effect','포기하다|pogihada|to give up','노력하다|noryeokhada|to make an effort'],
 g:[{p:'-는 것 같다',m:'it seems that',n:'Present verbs take 는, adjectives take (으)ㄴ. A softened guess.',x:['비가 오는 것 같아요.','It seems to be raining.'],q:['지금 비가 오___ 것 같아요.','는','은','ㄹ']},
    {p:'-(으)려고',m:'in order to',n:'Intention behind an action. Same subject in both clauses.',x:['한국어를 배우려고 왔어요.','I came to learn Korean.'],q:['친구를 만나___ 왔어요.','려고','지만','니까']},
    {p:'-(으)ㄹ 수 있다',m:'can, be able to',n:'Use 없다 for the negative: 할 수 없어요.',x:['한국어를 할 수 있어요.','I can speak Korean.'],q:['저는 수영을 할 ___ 있어요.','수','것','거']}]}
];
/* ============ APP ============ */
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const W=j=>DATA[j].w||(DATA[j].w=DATA[j].v.map(s=>{const[k,r,e]=s.split('|');return{k,r,e,id:DATA[j].id+k}}));
let lv=0,mode='cards',i=0,flipped=false,eng=false,order=shuf(W(0).map((_,x)=>x)),q=null,score={r:0,t:0},known={};
try{known=JSON.parse(localStorage.getItem('krKnown')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('krKnown',JSON.stringify(known))}catch(e){}};

function render(){
 $('lv').innerHTML=DATA.map((d,j)=>`<button class="${j==lv?'on':''}" onclick="setLv(${j})">${d.id}</button>`).join('');
 $('md').innerHTML=[['cards','Flashcards'],['quiz','Word quiz'],['gram','Grammar'],['cat','Categories']].map(([m,t])=>`<button class="${m==mode?'on':''}" onclick="setMode('${m}')">${t}</button>`).join('');
 $('lv').style.display=mode=='cat'?'none':'';
 $('prog').textContent=mode=='cat'?`${cats[ci].n}: ${P().filter(w=>known[w.id]).length} of ${cats[ci].v.length} words known`:`${DATA[lv].t}: ${W(lv).filter(w=>known[w.id]).length} of ${W(lv).length} words known`;
 $('main').innerHTML=mode=='cat'?catHTML():mode=='cards'?cardsHTML():mode=='quiz'?quizHTML():gramHTML();
}
function setLv(j){lv=j;i=0;flipped=false;order=shuf(W(j).map((_,x)=>x));q=null;render()}
function setMode(m){mode=m;i=0;flipped=false;order=[];q=null;if(m=='quiz')newQ();render()}

function cardsHTML(){
 const w=cur();
 const front=eng?`<div class="en">${w.e}</div>`:`<div class="kr">${w.k}</div>`;
 const back=eng?`<div class="kr">${w.k}</div><p>${w.r}</p>`:`<div class="en">${w.e}</div><p>${w.r}</p>`;
 return `<button class="card" onclick="flipped=!flipped;render()" aria-label="Flip card">${flipped?back:front}<p>${known[w.id]?'Marked as known':'Tap to flip'}</p></button>
 <div class="acts"><button class="again" onclick="mark(0)">Again</button><button class="good" onclick="mark(1)">Got it</button></div>
 <p class="hint"><label><input type="checkbox" ${eng?'checked':''} onchange="eng=this.checked;flipped=false;render()"> Show English first</label></p>`;
}
function mark(ok){const w=cur();if(ok)known[w.id]=1;else delete known[w.id];save();i++;flipped=false;render()}

function newQ(){let pool=[];if(mode=='cat')pool=P();else for(let j=0;j<=lv;j++)pool.push(...W(j));const w=pick(pool);const o=[w];while(o.length<4){const x=pick(pool);if(!o.includes(x))o.push(x)}q={w,o:shuf(o),done:false}}
function quizHTML(){
 if(!q)newQ();
 return `<div class="card" style="cursor:default">${eng?`<div class="en">${q.w.e}</div>`:`<div class="kr">${q.w.k}</div><p>${q.w.r}</p>`}</div>
 <div class="opts">${q.o.map((o,x)=>`<button onclick="ans(${x},this)">${eng?o.k:o.e}</button>`).join('')}</div>
 <p class="hint" id="fb">${mode=='cat'?cats[ci].n:'Words from 1A up to '+DATA[lv].id}. Score: ${score.r} of ${score.t}</p>
 <div class="acts"><button onclick="newQ();render()">Next word</button><button onclick="eng=!eng;render()">${eng?'Ask in Korean':'Ask in English'}</button></div>`;
}
function ans(x,b){
 if(q.done)return;const ok=q.o[x]===q.w;
 b.classList.add(ok?'ok':'no');
 if(ok){q.done=true;score.r++;score.t++;known[q.w.id]=1;save();$('fb').textContent=`Correct: ${q.w.k} = ${q.w.e}`}
 else{score.t++;$('fb').textContent='Not quite. Try another answer.'}
}

function gramHTML(){
 return DATA[lv].g.map((g,gi)=>{const o=shuf(g.q.slice(1));
 return `<article class="g"><h3>${g.p}</h3><p class="m">${g.m}</p><p>${g.n}</p>
 <p class="x">${g.x[0]}<br><span>${g.x[1]}</span></p>
 <div class="pr"><b>${g.q[0].replace('___','<u></u>')}</b><div>${o.map(t=>`<button onclick="gAns(this,${gi})">${t}</button>`).join('')}</div><em></em></div></article>`}).join('');
}
function gAns(b,gi){
 const g=DATA[lv].g[gi],ok=b.textContent===g.q[1],fb=b.parentElement.nextElementSibling;
 b.classList.add(ok?'ok':'no');
 fb.style.color=ok?'var(--green)':'var(--red)';
 fb.textContent=ok?'Correct: '+g.q[0].replace('___',g.q[1]):'Not quite. Try another answer.';
 if(ok)b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);
}
/* ============ CATEGORIES — edit starter tabs here ============ */
const CATS=[
{n:'Places',v:['학교|hakgyo|school','집|jip|home','병원|byeongwon|hospital','은행|eunhaeng|bank','식당|sikdang|restaurant','카페|kape|cafe','시장|sijang|market','공항|gonghang|airport','도서관|doseogwan|library','지하철역|jihacheolyeok|subway station','화장실|hwajangsil|restroom','회사|hoesa|company, office']},
{n:'Numbers',v:['하나|hana|one (native)','둘|dul|two (native)','셋|set|three (native)','넷|net|four (native)','다섯|daseot|five (native)','여섯|yeoseot|six (native)','일곱|ilgop|seven (native)','여덟|yeodeol|eight (native)','아홉|ahop|nine (native)','열|yeol|ten (native)','일|il|one (Sino)','이|i|two (Sino)','삼|sam|three (Sino)','사|sa|four (Sino)','오|o|five (Sino)','육|yuk|six (Sino)','칠|chil|seven (Sino)','팔|pal|eight (Sino)','구|gu|nine (Sino)','십|sip|ten (Sino)','백|baek|100','천|cheon|1,000','만|man|10,000']},
{n:'Verbs',v:['하다|hada|to do','가다|gada|to go','오다|oda|to come','먹다|meokda|to eat','마시다|masida|to drink','보다|boda|to see, watch','듣다|deutda|to listen','읽다|ikda|to read','쓰다|sseuda|to write','말하다|malhada|to speak','사다|sada|to buy','자다|jada|to sleep','일어나다|ireonada|to wake up','공부하다|gongbuhada|to study','만나다|mannada|to meet','배우다|baeuda|to learn','주다|juda|to give','알다|alda|to know']}
];
let cats=null,ci=0,cv='list',bm='',bt='';
try{cats=JSON.parse(localStorage.getItem('krCats'))}catch(e){}
if(!Array.isArray(cats)||!cats.length)cats=CATS.map(c=>({n:c.n,v:c.v.map(s=>{const[k,r,e]=s.split('|');return{k,r,e}})}));
const saveC=()=>{try{localStorage.setItem('krCats',JSON.stringify(cats))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=()=>mode=='cat'?(cats[ci]?cats[ci].v.map(w=>({k:w.k,r:w.r,e:w.e,id:'c'+cats[ci].n+w.k})):[]):W(lv);
function cur(){const p=P();if(order.length!==p.length)order=shuf(p.map((_,x)=>x));return p[order[i%order.length]]}

function catHTML(){
 const c=cats[ci];
 const tabs=cats.map((x,j)=>`<button class="${j==ci?'on':''}" onclick="setCat(${j})">${x.n}</button>`).join('')+`<button class="add" onclick="addCat()">+ New tab</button>`;
 const views=[['list','Word list'],['cards','Flashcards'],['quiz','Quiz']].map(([v,t])=>`<button class="${v==cv?'on':''}" onclick="cv='${v}';q=null;flipped=false;render()">${t}</button>`).join('');
 let body;
 if(cv=='list')body=listHTML(c);
 else if(c.v.length<(cv=='quiz'?4:1))body=`<p class="hint">Add ${cv=='quiz'?'at least 4 words':'a word'} in the word list to practice this tab.</p>`;
 else body=cv=='cards'?cardsHTML():quizHTML();
 return `<div class="sub">${tabs}</div><div class="row">${views}</div>${body}`;
}
function listHTML(c){
 return `<ul class="wl">${c.v.map((w,x)=>`<li><span class="k">${w.k}</span><span>${w.e}<br><small>${w.r||''}</small></span><button class="del" onclick="delWord(${x})" aria-label="Delete ${w.k}">×</button></li>`).join('')||'<li>No words yet. Add your first one below.</li>'}</ul>
 <div class="af"><input id="nk" placeholder="한글" lang="ko"><input id="nr" placeholder="Romanization (optional)"><input id="ne" placeholder="Meaning"><button class="on" onclick="addWord()">Add word</button></div>
 <div class="bk"><h4>Add many words at once</h4>
 <p class="hint">One word per line: <b>한글, romanization, meaning</b> (romanization is optional: <b>한글, meaning</b>). You can also separate with | or a tab, so pasting from Excel or Google Sheets works.</p>
 <textarea id="bulk" class="bulk" lang="ko" placeholder="사과, sagwa, apple&#10;바나나, banana&#10;우유 | uyu | milk">${esc(bt)}</textarea>
 <div class="af"><button class="on" onclick="addBulk()">Add all words</button></div>
 <p class="hint" role="status">${bm}</p></div>
 <p class="hint"><button onclick="delCat()">Delete this tab</button></p>`;
}
function setCat(j){bm='';bt='';ci=j;i=0;flipped=false;order=[];q=null;render()}
function addCat(){const n=(prompt('Name for the new tab (for example Food, Family, Colors):')||'').trim();if(!n)return;cats.push({n:esc(n),v:[]});ci=cats.length-1;cv='list';i=0;order=[];q=null;saveC();render()}
function addWord(){const k=$('nk').value.trim(),e=$('ne').value.trim();if(!k||!e){$('nk').focus();return}cats[ci].v.push({k:esc(k),r:esc($('nr').value.trim()),e:esc(e)});order=[];saveC();render();$('nk').focus()}
function addBulk(){
 const lines=$('bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),have=new Set(cats[ci].v.map(w=>w.k));
 let added=0,dup=0;const bad=[];
 for(const l of lines){
  let a=l.includes('|')?l.split('|'):l.includes('\t')?l.split('\t'):l.split(/\s*[,，]\s*/);
  a=a.map(x=>x.trim()).filter(x=>x!=='');
  if(a.length<2){bad.push(l);continue}
  const k=a[0],r=a.length>2?a[1]:'',e=a.length>2?a.slice(2).join(', '):a[1];
  if(have.has(esc(k))){dup++;continue}
  cats[ci].v.push({k:esc(k),r:esc(r),e:esc(e)});have.add(esc(k));added++;
 }
 bt=bad.join('\n');
 bm=`Added ${added} word${added==1?'':'s'}.`+(dup?` Skipped ${dup} already in this tab.`:'')+(bad.length?` ${bad.length} line${bad.length==1?'':'s'} need a meaning and stayed in the box.`:'');
 order=[];saveC();render();
}
